<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff login | Us Vesta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/images/favicon.png?v=2" rel="icon" type="image/png">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 380px; width: 100%;">
      <div class="text-center mb-3">
        <img src="/static/images/logo2.png" alt="Us Vesta" style="height: 42px;">
        <h1 class="h5 fw-bold mt-3 mb-0">Wellcome To Us Vesta Portal</h1>
        <p class="text-muted small">Staff sign in</p>
      </div>
      {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="username">Username</label>
          <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-dark w-100 rounded-pill fw-bold" type="submit">Log in</button>
      </form>
    </div>
  </main>
</body>
</html>
